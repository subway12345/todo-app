<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="script.js" defer></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 sm:p-6 lg:p-10">

  <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-lg p-6 sm:p-10">

    <!-- Header -->
    <header class="flex items-center justify-between mb-8 gap-4">
     <div class="flex-1 max-w-md relative">
        <form id="search-form" class="flex-1 max-w-md relative transition-all duration-300 focus-within:max-w-lg">
        <input id="search-input" type="text" placeholder="Search for any task..." autocomplete="off"
        class="peer w-full pl-12 pr-4 py-3 bg-gray-50 border-2 border-gray-200 rounded-full text-gray-700 placeholder-gray-400 shadow-sm outline-none transition-all duration-300 ease-out hover:border-purple-300 hover:shadow-md focus:bg-white focus:border-purple-500 focus:shadow-[0_0_0_4px_rgba(139,92,246,0.2)] focus:-translate-y-0.5">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 transition-all duration-300 peer-focus:text-purple-600 peer-focus:scale-110 peer-focus:-rotate-12"></i>
        <p id="search-error" class="hidden absolute left-4 top-full mt-2 text-red-600 text-sm"></p>
        </form>
     </div>
      <div class="flex items-center gap-3">
        <button class="relative w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition">
          <i class="fa-solid fa-bell text-gray-600"></i>
          <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <button class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-gray-200 flex items-center justify-center transition">
          <i class="fa-solid fa-user text-gray-600"></i>
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-8">

      <!-- Main content -->
      <main>
        <div class="flex flex-wrap items-center justify-between gap-4 mb-8">
          <div>
            <p id="greeting" class="text-gray-500 text-base mb-2">Good morning, Kazeem</p>
            <h1 class="text-3xl sm:text-4xl font-bold text-pink-500">
              <span id="task-count">0</span> Tasks Today
            </h1>
          </div>
          <button id="add-task-btn"
            class="bg-purple-600 hover:bg-purple-700 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition">
            <i class="fa-solid fa-plus mr-2"></i>Add New
          </button>
        </div>

        <!-- On Hold section -->
        <section class="mb-8">
          <div class="flex items-center gap-3 mb-4">
            <h2 class="text-xl font-semibold text-gray-700">On Hold</h2>
            <span class="px-3 py-1 text-xs font-semibold rounded-full bg-red-100 text-red-600">
              <span id="on-hold-count">0</span> Active
            </span>
          </div>
          <div id="on-hold-list" class="space-y-3"></div>
        </section>

        <!-- Completed section -->
        <section>
          <div class="flex items-center gap-3 mb-4">
            <h2 class="text-xl font-semibold text-gray-700">Completed</h2>
            <span class="px-3 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-600">
              <span id="completed-count">0</span> Done
            </span>
          </div>
          <div id="completed-list" class="space-y-3"></div>
        </section>
      </main>

      <!-- Sidebar -->
      <aside class="bg-gray-50 rounded-2xl p-6">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Result Summary</h2>

        <div class="bg-white rounded-xl p-5 mb-4 shadow-sm">
          <p class="text-sm text-gray-500 mb-1">Completion Rate</p>
          <p id="completion-rate" class="text-2xl font-bold text-gray-800">0%</p>
          <div class="w-full h-2 bg-gray-200 rounded-full overflow-hidden mt-3">
            <div id="completion-bar" class="h-full bg-purple-600 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>

        <div class="bg-white rounded-xl p-5 mb-4 shadow-sm">
          <p class="text-sm text-gray-500 mb-1">Total Tasks</p>
          <p id="total-count" class="text-2xl font-bold text-gray-800">0</p>
        </div>

        <div class="bg-white rounded-xl p-5 mb-4 shadow-sm">
          <p class="text-sm text-gray-500 mb-1">Completed</p>
          <p id="sidebar-completed" class="text-2xl font-bold text-green-600">0</p>
        </div>

        <div class="bg-white rounded-xl p-5 shadow-sm">
          <p class="text-sm text-gray-500 mb-1">Pending</p>
          <p id="pending-count" class="text-2xl font-bold text-red-500">0</p>
        </div>
      </aside>

    </div>
  </div>

  <!-- Add / Edit modal -->
  <div id="task-modal" class="hidden fixed inset-0 bg-black/40 items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 w-full max-w-md">
      <h3 id="modal-title" class="text-2xl font-bold text-gray-800 mb-6">Add Task</h3>

      <form id="task-form">
        <div class="mb-5">
          <label for="task-title" class="block text-sm font-semibold text-gray-700 mb-2">Task Title</label>
         <input id="task-title" type="text" placeholder="Enter task title" required
           class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 transition">
           <p id="title-error" class="hidden text-red-600 text-sm mt-2"></p>
        </div>

        <div class="mb-5">
          <label for="task-status" class="block text-sm font-semibold text-gray-700 mb-2">Status</label>
          <select id="task-status"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 transition">
            <option value="pending">Pending</option>
            <option value="progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="mb-6">
          <label for="task-priority" class="block text-sm font-semibold text-gray-700 mb-2">Priority</label>
          <select id="task-priority"
            class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-purple-500 transition">
            <option value="minor">Minor</option>
            <option value="normal">Normal</option>
            <option value="critical">Critical</option>
          </select>
        </div>

        <div class="flex justify-end gap-3">
          <button type="button" id="cancel-btn"
            class="px-6 py-3 rounded-xl bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold transition">
            Cancel
          </button>
          <button type="submit"
            class="px-6 py-3 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-semibold transition">
            Save Task
          </button>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
